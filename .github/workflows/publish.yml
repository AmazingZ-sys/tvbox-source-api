name: Collect and publish sources

on:
  schedule:
    # UTC 01:23 = Asia/Shanghai 09:23. GitHub may delay scheduled runs.
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -v
      - name: Fetch configurations and probe Kazumi sources
        id: collect
        run: python tvbox_source_api.py --output-dir public
      - name: Preserve this run's diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: public/report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
